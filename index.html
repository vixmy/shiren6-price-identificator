<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8a5a2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="シレン6値段">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>シレン6 値段識別</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- 1. 入力表示欄 -->
    <header class="price-bar">
      <label for="price-input" class="visually-hidden">値段</label>
      <input
        id="price-input"
        class="price-input"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        spellcheck="false"
        enterkeyhint="done"
        placeholder="値段"
      >
      <span class="price-unit">G</span>
    </header>

    <!-- 2. カテゴリフィルタ -->
    <nav class="filters" aria-label="カテゴリフィルタ">
      <button type="button" class="filter-btn is-active" data-filter="all">すべて</button>
      <button type="button" class="filter-btn" data-filter="grass">草</button>
      <button type="button" class="filter-btn" data-filter="scroll">巻物</button>
      <button type="button" class="filter-btn" data-filter="staff">杖</button>
      <button type="button" class="filter-btn" data-filter="bracelet">腕輪</button>
      <button type="button" class="filter-btn" data-filter="pot">壺</button>
      <button type="button" class="filter-btn" data-filter="weapon_shield">武器・盾</button>
    </nav>

    <!-- 3. 検索結果一覧 -->
    <main class="results" aria-live="polite">
      <p class="results-count" id="results-count" hidden></p>
      <p class="results-message" id="results-message">値段を入力してください</p>
      <div class="result-list" id="result-list"></div>
    </main>

    <!-- 4. テンキー -->
    <div class="keypad-area">
      <div class="keypad-bar">
        <span class="app-version" id="app-version"></span>
        <button type="button" class="keypad-toggle" id="keypad-toggle" aria-controls="keypad" aria-expanded="true" aria-label="テンキーを隠す">∨</button>
      </div>
      <div class="keypad" id="keypad">
        <button type="button" class="key" data-key="7">7</button>
        <button type="button" class="key" data-key="8">8</button>
        <button type="button" class="key" data-key="9">9</button>
        <button type="button" class="key" data-key="4">4</button>
        <button type="button" class="key" data-key="5">5</button>
        <button type="button" class="key" data-key="6">6</button>
        <button type="button" class="key" data-key="1">1</button>
        <button type="button" class="key" data-key="2">2</button>
        <button type="button" class="key" data-key="3">3</button>
        <button type="button" class="key key-func" data-key="clear" aria-label="全消去">C</button>
        <button type="button" class="key" data-key="0">0</button>
        <button type="button" class="key key-func" data-key="backspace" aria-label="1文字削除">⌫</button>
      </div>
    </div>
  </div>

  <script src="data/items.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
